[project]
name = "aksharaos"
version = "0.2.0"
description = "Open-source language knowledge platform for Telugu and Indic language resources"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "analysis",
    "ingestion",
    "ingestion.processors",
    "rag",
    "utils",
    "api",
    "knowledge",
    "naming",
    "feedback"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Keep the existing CI rule set explicit across Ruff versions.
select = ["E4", "E7", "E9", "F"]
